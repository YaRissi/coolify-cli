before:
  hooks:
    - go mod tidy
builds:
  - binary: coolify
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/coollabsio/coolify-cli/internal/version.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
