version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: coolify
    binary: coolify
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X {{ .ModulePath }}/internal/version.version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.versionPrerelease={{- if .IsSnapshot -}}dev+{{ .ShortCommit }}{{- end -}}
    main: ./coolify/main.go
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0